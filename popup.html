<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yumi Focus Hours</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="popup-page">
  <header class="popup-header"><div class="brand"><img class="brand-logo" src="assets/yumi-logo-head-solid.svg" alt="" width="42" height="42"><span class="wordmark">Yumi Focus Hours<small>A little space to focus.</small></span></div><span class="local-label"><span aria-hidden="true"></span>Local</span></header>
  <main class="popup-shell">
    <section class="popup-routine-card" aria-label="Your focus routine"><div class="popup-intro"><span id="status-badge" class="status-pill">Checking schedule…</span><h1 id="popup-title">A little space<br>to focus.</h1><p id="next-change" class="muted">Loading your routine…</p></div><div id="popup-summary" class="popup-summary"></div></section>
    <p id="popup-message" class="message" role="status" aria-live="polite"></p>
    <button id="open-settings" class="button primary full-width" type="button">Settings <span aria-hidden="true">↗</span></button>
    <p id="popup-footer" class="popup-footer">Schedules follow your local time.</p>
  </main>
</body>
</html>
